<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640">
  <title>Sample room illustration: the planned living room with rug, coffee table, lamp, and sage curtains</title>
  <rect width="800" height="440" fill="#ece3d6"/>
  <rect y="440" width="800" height="200" fill="#c9a882"/>
  <path d="M0 440h800" stroke="#b08d68" stroke-width="4"/>
  <!-- window + sage curtains -->
  <rect x="545" y="70" width="170" height="250" fill="#dfe9ee" stroke="#fff" stroke-width="12"/>
  <path d="M630 70v250M545 195h170" stroke="#fff" stroke-width="8"/>
  <rect x="515" y="52" width="230" height="7" rx="3" fill="#5a4a3e"/>
  <path d="M520 59h48v330c-14-6-34-6-48 0z" fill="#8a9a7b"/>
  <path d="M692 59h48v330c-14-6-34-6-48 0z" fill="#8a9a7b"/>
  <!-- art -->
  <rect x="190" y="95" width="150" height="110" fill="#fff" stroke="#3a2f28" stroke-width="6"/>
  <circle cx="240" cy="140" r="24" fill="#c0643c"/>
  <rect x="255" y="150" width="62" height="38" fill="#8a9a7b"/>
  <!-- lamp -->
  <path d="M60 165h64l12 50H48z" fill="#efe3cf" stroke="#d8c6a8" stroke-width="3"/>
  <rect x="88" y="215" width="7" height="225" fill="#5a4a3e"/>
  <ellipse cx="92" cy="442" rx="28" ry="6" fill="#5a4a3e"/>
  <!-- rug -->
  <path d="M110 470h500l70 130H40z" fill="#d9c7ae"/>
  <path d="M135 482h450l52 104H83z" fill="none" stroke="#c4ae90" stroke-width="4"/>
  <!-- sofa (kept) -->
  <rect x="130" y="270" width="350" height="110" rx="24" fill="#8f9296"/>
  <rect x="110" y="320" width="390" height="90" rx="20" fill="#7d8085"/>
  <rect x="102" y="290" width="42" height="120" rx="16" fill="#86898e"/>
  <rect x="466" y="290" width="42" height="120" rx="16" fill="#86898e"/>
  <rect x="134" y="408" width="10" height="70" fill="#3d3530"/>
  <rect x="466" y="408" width="10" height="70" fill="#3d3530"/>
  <!-- pillows -->
  <rect x="160" y="280" width="62" height="56" rx="14" fill="#a5492a" transform="rotate(-8 191 308)"/>
  <rect x="390" y="282" width="62" height="56" rx="14" fill="#b5562f" transform="rotate(7 421 310)"/>
  <!-- side table -->
  <ellipse cx="560" cy="420" rx="32" ry="8" fill="#a5492a"/>
  <rect x="557" y="422" width="7" height="58" fill="#8a3b1f"/>
  <ellipse cx="560" cy="482" rx="22" ry="5" fill="#8a3b1f"/>
  <!-- coffee table -->
  <ellipse cx="320" cy="512" rx="110" ry="26" fill="#b98a5e"/>
  <rect x="262" y="528" width="9" height="52" fill="#9b7049"/>
  <rect x="369" y="528" width="9" height="52" fill="#9b7049"/>
  <!-- ottoman -->
  <rect x="610" y="500" width="110" height="64" rx="12" fill="#e4d8c5"/>
  <rect x="606" y="490" width="118" height="18" rx="9" fill="#ece3d4"/>
  <!-- plant -->
  <rect x="40" y="520" width="44" height="54" fill="#5a4a3e"/>
  <path d="M30 520c8-56 58-56 64 0z" fill="#6f7f63"/>
</svg>
